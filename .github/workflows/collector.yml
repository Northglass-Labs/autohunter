name: Scheduled collector

on:
  schedule:
    - cron: "17 10 * * *"
  workflow_dispatch:
    inputs:
      collection_only:
        description: Collect inventory without sending email
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: production-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: collector
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: collector/package-lock.json
      - run: npm ci --ignore-scripts
      - name: Validate required secrets
        shell: bash
        env:
          AUTOHUNTER_APP_URL: ${{ secrets.AUTOHUNTER_APP_URL }}
          AUTOHUNTER_INGEST_SECRET: ${{ secrets.AUTOHUNTER_INGEST_SECRET }}
          AUTOHUNTER_CRON_SECRET: ${{ secrets.AUTOHUNTER_CRON_SECRET }}
          MARKETCHECK_API_KEY: ${{ secrets.MARKETCHECK_API_KEY }}
          AUTODEV_API_KEY: ${{ secrets.AUTODEV_API_KEY }}
        run: |
          test -n "$AUTOHUNTER_APP_URL"
          test -n "$AUTOHUNTER_INGEST_SECRET"
          test -n "$AUTOHUNTER_CRON_SECRET"
          test -n "$MARKETCHECK_API_KEY"
      - run: npm run platform:cycle
        if: github.event_name == 'schedule' || !inputs.collection_only
        env:
          AUTOHUNTER_APP_URL: ${{ secrets.AUTOHUNTER_APP_URL }}
          AUTOHUNTER_INGEST_SECRET: ${{ secrets.AUTOHUNTER_INGEST_SECRET }}
          AUTOHUNTER_CRON_SECRET: ${{ secrets.AUTOHUNTER_CRON_SECRET }}
          MARKETCHECK_API_KEY: ${{ secrets.MARKETCHECK_API_KEY }}
          AUTODEV_API_KEY: ${{ secrets.AUTODEV_API_KEY }}
      - run: npm run platform:collect
        if: github.event_name == 'workflow_dispatch' && inputs.collection_only
        env:
          AUTOHUNTER_APP_URL: ${{ secrets.AUTOHUNTER_APP_URL }}
          AUTOHUNTER_INGEST_SECRET: ${{ secrets.AUTOHUNTER_INGEST_SECRET }}
          MARKETCHECK_API_KEY: ${{ secrets.MARKETCHECK_API_KEY }}
          AUTODEV_API_KEY: ${{ secrets.AUTODEV_API_KEY }}
